name: Grassroots Unwired
description: Grassroots Unwired is a mobile-first platform for face-to-face (F2F) outreach, advocacy,
  and fundraising, purpose-built for political campaigns, nonprofits, labor unions, and community
  organizations. Its offline-capable mobile apps let field teams run GPS-enabled door-to-door
  canvassing, capture in-person and peer-to-peer donations, send SMS and digital content from the
  field, and manage event check-in, registration, and merchandise operations for 4EventDay. The
  platform keeps collecting data, donations, and check-ins even when Wi-Fi and cell coverage are
  spotty, then syncs in real time with major CRM, donor, and payment systems (EveryAction, NGP VAN,
  Blackbaud Luminate, NeonCRM, Stripe, and others).
